services:
  - type: worker
    name: meeshonumbot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        value: 6985172891
      - key: OTP_API_KEY
        sync: false
      - key: SPEEDZ_API_KEY
        sync: false
